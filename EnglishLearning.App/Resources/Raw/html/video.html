<style>
    body { margin: 0 0 0 0; }   
</style>

<video id="player" style="height:400px; width:100%; background-color:#000;margin:0 0 0 0;" controls src="$$SRC$$" poster="$$POSTER$$"></video>

<script>
   
    var isLoaded = false;
    var player = document.getElementById("player");

    player.onloadeddata = function () {
        isLoaded = true;        
    };

    player.onloadedmetadata = function () {
        var width = player.videoWidth;
        var height = player.videoHeight;

        if (height > width) { //竖屏
            var style = document.createElement('style');
            style.innerHTML = 'video::-webkit-media-controls-fullscreen-button { display: none;} ';
            document.head.appendChild(style);
        }
    };
</script>
